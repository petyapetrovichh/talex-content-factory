<!doctype html>
<!--
  S08 — LOGO. Over S07's dissolving pill (this root is transparent; the video root is black), the full TaleX
  logo (light version: white wordmark, green mark) slides in from a HUGE size into the center with motion
  blur + zoom echoes and eases to a stop, then holds to the last frame of the track (glow breathing, very
  slow push). Timing from shotlist.yaml (window.__TALEX__). Scene-local time.
-->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="S08_logo-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s08-glow {
          position: absolute;
          left: -110px;
          top: 620px;
          width: 1300px;
          height: 680px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(111, 240, 0, 0.22), rgba(111, 240, 0, 0.06) 55%, rgba(111, 240, 0, 0) 100%);
          opacity: 0;
        }
        #s08-cam {
          position: absolute;
          inset: 0;
        }
        #s08-fly {
          position: absolute;
          inset: 0;
          filter: url(#s08-blur);
        }
        .s08-logo {
          position: absolute;
          left: 360px;
          top: 476px;
          width: 720px;
          height: 128px;
          overflow: visible;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="S08_logo" data-width="1080" data-height="1920">
        <svg width="0" height="0" style="position: absolute">
          <filter id="s08-blur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s08-blur-fe" stdDeviation="0 0" />
          </filter>
        </svg>
        <div id="s08-glow"></div>
        <div id="s08-stage" data-layout-allow-overflow="true">
        <div id="s08-cam" data-layout-allow-overflow="true">
          <div id="s08-fly" data-layout-allow-overflow="true">
            <svg class="s08-logo" id="s08-echo-2" data-layout-allow-overlap="true"></svg>
            <svg class="s08-logo" id="s08-echo-1" data-layout-allow-overlap="true"></svg>
            <svg class="s08-logo" id="s08-logo" data-layout-allow-overlap="true"></svg>
          </div>
        </div>
        </div>
      </div>

      <script>
        (function () {
          const D = window.__TALEX__;
          const FX = window.TalexFX;
          const S = D.shots.S08;
          const C = D.tokens.colors;
          const L = (t) => t - S.start;
          const $ = (id) => document.getElementById(id);
          const NS = "http://www.w3.org/2000/svg";
          const tl = gsap.timeline({ paused: true });
          const END = L(S.end);
          FX.stage($("s08-stage"), S.stage, D.video); // 9:16: centered, scaled 1440×1080 design stage

          // light logo: white wordmark + green mark (brand/talex-logo.svg); echoes tinted for the smear
          const logo = D.brand.logo;
          [["s08-logo", null], ["s08-echo-1", C.green], ["s08-echo-2", C.violet]].forEach(([id, tint]) => {
            const svg = $(id);
            svg.setAttribute("viewBox", logo.viewBox);
            logo.paths.forEach((p) => {
              const e = document.createElementNS(NS, "path");
              e.setAttribute("d", p.d);
              e.setAttribute("fill", tint || (p.fill === "white" ? C.white : p.fill));
              svg.appendChild(e);
            });
          });

          // ---------- fly-in from a HUGE size, blur tied to the scale velocity ----------
          const a = L(S.logo_in.start), b = L(S.logo_in.end);
          const eIn = gsap.parseEase("expo.out");
          const sc = (t) => {
            const p = Math.max(0, Math.min(1, (t - a) / (b - a)));
            return 1 + 11 * (1 - eIn(p)); // 12× → 1×
          };
          const fe = $("s08-blur-fe");
          const logos = ["s08-logo", "s08-echo-1", "s08-echo-2"].map($);
          FX.driver(tl, 0, END, (t) => {
            const s = sc(t);
            const v = Math.abs(sc(t + 1 / 60) - sc(t - 1 / 60)) * 30; // scale units / s
            const live = t >= a;
            logos[0].style.opacity = live ? "1" : "0";
            logos[0].style.scale = String(s);
            logos[0].style.translate = `${(40 * (s - 1)).toFixed(1)}px ${(-6 * (s - 1)).toFixed(1)}px`;
            // zoom echoes = the smear of the fly-in: larger, fading as the logo settles
            logos.slice(1).forEach((el, i) => {
              const es = s * (1 + 0.12 * (i + 1) * Math.min(1, v / 8));
              el.style.scale = String(es);
              el.style.translate = logos[0].style.translate;
              el.style.opacity = live ? String(Math.min(0.5, v / 40) * (1 - i * 0.35)) : "0";
            });
            const blur = live ? Math.min(22, v * 0.9) : 0;
            fe.setAttribute("stdDeviation", `${blur.toFixed(1)} ${blur.toFixed(1)}`);
          });

          // ---------- hold: glow breathing + very slow push ----------
          tl.fromTo("#s08-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, b - 0.25);
          tl.fromTo("#s08-glow", { scale: 1 }, { scale: 1.12, duration: (END - b) / 2, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, b + 0.25);
          tl.fromTo("#s08-cam", { scale: 1 }, { scale: 1.025, duration: END - b, ease: "sine.inOut" }, b);

          window.__timelines["S08_logo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
