# Shotlist — 2026-10_treasury-daily (full announcement, v2)
#
# ALL times are GLOBAL seconds on the video timeline, 30 fps. pipeline/lib.mjs snaps every time field
# (start/end/at/tail/…_at/review_at) to the frame grid, so "8.067" means exactly frame 242.
# Copy/numbers are NOT written here: `text:` entries reference keys in brief.md (```yaml copy```).
# Scenes read this file through pipeline/build.mjs (window.__TALEX__.shots.<id>).
#
# MUSIC IS THE CLOCK — audio/music/track.mp3, analysed with `npx hyperframes beats` + band energy:
#   tempo 120 BPM → beat grid  t = 0.067 + 0.5·n  (every 15 frames: f2, f17, f32, …); eighths at +0.25
#   build 0 → 7.5 s, breath (low end gone) 7.60 → 8.05 s, DROP = kick onset 8.067 s = frame 242,
#   groove to ~15.6 s, reverb tail to the end of the file (18.129 s) → the video ends on frame 544.
# Every cut, burst and reveal below sits on a beat (or an eighth where noted).
#
# Edit one shot: change only its block, then `npm run review -- S05` (see PIPELINE.md).

video:
  id: 2026-10_treasury-daily
  title: TaleX Treasury — daily injections (v2)
  width: 1440
  height: 1080
  fps: 30
  duration: 18.133          # = end of track.mp3 (18.129 s) rounded up to the next frame (544 frames)
  output: treasury_daily_v2.mp4
  music: audio/music/track.mp3
  music_drop: 8.067
  beats:
    bpm: 120
    origin: 0.067           # first beat
    period: 0.5
    drop: 8.067             # frame 242 — S03 starts here
    source: "npx hyperframes beats (onsets 8.081, 8.568, 10.077, 10.577, 11.575, 12.086, 12.574, 14.083, 14.571, 15.081 …) + low-band energy (kick onset 8.06–8.08)"
  mix:
    music_gain_db: 0               # the track carries the energy; it is never ducked
    music_build_ramp_db: [0, 0]
    duck_db: 0
    music_fade_out: null           # the track's own ending finishes the video
    sfx_headroom_db: 3             # SFX bus peaks stay ≥ 3 dB under the music's peak
    loudness_lufs: -14
    true_peak_db: -1

shots:
  # ------------------------------------------------------------------------------------------------
  - id: S01
    name: counter
    scene: scenes/S01_counter.html
    start: 0.0
    end: 5.067              # beat
    tail: 0.5               # renders under S02 for the compress-into-a-stream hand-off
    background: graphite #141414 — subtle radial vignette, no glow blobs; motion from the slow push-in while counting
    visual: >
      Big centered green number with strong bloom. Plain digital RE-COUNT (value updates every frame, no
      odometer), comma-formatted, tabular nums. Three bursts, each bigger than the last. Label under the
      number with a scrambled reveal, held (readable) until the cut.
    text:
      - { key: number_value, role: hero_number }
      - { key: number_label, role: caption, reveal: glitch }
    counter:
      # constant rate inside a segment, faster each segment (100/s → 600/s → 2126/s)
      segments:
        - { from: counter_start,        to: counter_milestones.0, start: 0.067, end: 1.067 }
        - { from: counter_milestones.0, to: counter_milestones.1, start: 1.067, end: 2.567 }
        - { from: counter_milestones.1, to: number_value,         start: 2.567, end: 3.567 }
    bursts:
      - { id: burst_1, at: 1.067, scale: 1.08, flare: small,  rings: 1, ring_scale: 3.2, sparks: 12, rgb_split_frames: 0, shake_px: 0, white_flash_frames: 0 }
      - { id: burst_2, at: 2.567, scale: 1.15, flare: medium, rings: 1, ring_scale: 5.0, ring_stroke_px: 5, sparks: 30, rgb_split_frames: 2, rgb_split_px: 12, shake_px: 3, white_flash_frames: 0 }
      - { id: burst_3, at: 3.567, scale: 1.25, flare: max,    rings: 2, ring_scale: 8.0, ring_stroke_px: 8, sparks: 60, rgb_split_frames: 3, rgb_split_px: 24, shake_px: 9, white_flash_frames: 2 }
    label_reveal: { start: 3.667, duration: 0.42 }      # fully readable from ~4.1 s to the cut
    transition_out:
      type: compress_stream
      start: 5.067
      end: 5.567
      detail: >
        The number squashes into a thin glowing green bar (scaleY → 0.06, scaleX → 1.3, bloom up) and
        dissolves into S02's particle stream, which is pulled to the right. The black world slides left.
    camera: slow push-in 1.00→1.06 over the count; shake on burst_2 (light) and burst_3 (heavy)
    review_at: [0.4, 1.1, 1.8, 2.6, 3.1, 3.6, 4.3, 5.2]
    sfx:
      - { cue: burst_1, sound: hf_impact_small,  at: 1.067, gain_db: -19 }
      - { cue: burst_2, sound: hf_impact_medium, at: 2.567, gain_db: -15 }
      - { cue: burst_3, sound: hf_impact_big,    at: 3.567, gain_db: -13 }
      - { cue: label_reveal, sound: glitch_tick_soft, at: 3.667, gain_db: -10 }

  # ------------------------------------------------------------------------------------------------
  - id: S02
    name: treasury
    scene: scenes/S02_treasury.html
    start: 5.067
    end: 8.067              # the drop
    background: graphite → off-white #F7F7F7 (the white frame pushes in from the right = camera pan), faint static green/blue corner wash
    visual: >
      A glowing green stream of light/particles (the compressed number) is pulled to the right while the
      white frame pushes in from the right with the capsule. The stream pours into the capsule: a rounded
      glass pill with a thin black outline; the FULL TaleX logo (dark version) sits centered in a gap of the
      top outline; inside only "$X TREASURY". Echo outlines collapse on entry. Green liquid rises with a gentle
      wave, pulse on settle, caption glitch-reveals below. Last 0.4 s: everything eases to near-stillness.
    text:
      - { key: s02_headline, role: headline }
      - { key: s02_caption, role: caption, reveal: glitch }
    stream:
      start: 5.10            # S02's stream takes over from S01's squashed bar
      head_to_x: 1180        # head is pulled right …
      meet_at: 5.34          # … and meets the incoming capsule's left end
      absorb: { start: 5.567, end: 6.10 }
      particles: 90
    white_wall: { start: 5.10, end: 5.43 }
    pill:
      width: 1100
      height: 280
      center_y: 480
      enter_start: 5.10
      land: 5.567            # beat
      echo_collapse: { start: 5.43, end: 5.85 }
    logo_reveal: { start: 5.567, duration: 0.35 }
    fill:  { start: 5.62, end: 6.50, level: 0.8, wave_px: 12 }
    settle_pulse: { at: 6.567, scale: 1.035 }            # beat
    caption_reveal: { start: 6.067, duration: 0.45 }     # beat; on screen 2.0 s
    stillness: { start: 7.667, end: 8.067 }              # the breath before the drop (track goes quiet 7.60–8.05)
    camera: pans right on the push-in; slow push-in 1.00→1.025, easing to a stop in the last 0.4 s
    transition_out: { type: hard_cut, at: 8.067, detail: "hard cut to black exactly on the drop" }
    review_at: [5.2, 5.33, 5.45, 5.6, 6.0, 6.567, 7.0, 7.95]
    sfx:
      - { cue: push_whoosh,    sound: hf_whoosh,         at: 5.25,  gain_db: -12 }
      - { cue: liquid_fill,    sound: liquid_swell_soft, at: 5.62,  gain_db: -8 }
      - { cue: caption_reveal, sound: glitch_tick_soft,  at: 6.067, gain_db: -10 }

  # ------------------------------------------------------------------------------------------------
  - id: S03
    name: one_more_thing
    scene: scenes/S03_one_more_thing.html
    start: 8.067            # EXACTLY the drop (frame 242)
    end: 9.317              # the off-beat hit at 9.33 (detected onset 9.334)
    background: graphite #141414, flat; slow push-in
    visual: >
      Hard cut on the drop. "BUT THERE'S ONE MORE THING" slams in (scale punch 1.35→1, RGB split, white
      flash, sparks), then the three dots pop in one by one on the next beats/eighths.
    text:
      - { key: s03_text, role: headline }
      - { key: s03_dots, role: dots }
    slam: { at: 8.067 }
    dots_at: [8.567, 8.817, 9.067]                        # beat, eighth, beat
    camera: 3 px shake on the slam, slow push-in 1.00→1.04
    transition_out: { type: whip_up, start: 9.217, end: 9.317 }
    review_at: [8.08, 8.2, 8.6, 8.85, 9.1, 9.28]
    sfx:
      - { cue: dot_1, sound: hf_tick, at: 8.567, gain_db: -2 }
      - { cue: dot_2, sound: hf_tick, at: 8.817, gain_db: -2 }
      - { cue: dot_3, sound: hf_tick, at: 9.067, gain_db: -2 }

  # ------------------------------------------------------------------------------------------------
  - id: S04
    name: vote
    scene: scenes/S04_vote.html
    start: 9.317
    end: 11.067             # beat
    background: graphite #141414, flat (no glow blobs); motion from the camera only
    visual: >
      A modern phone in 3D perspective (tilted, soft reflection) rises from the bottom with motion blur,
      showing the cropped poll screenshot. The camera pushes in toward the "daily 97%" bar, which gets a
      pulsing green highlight/glow. Text above the phone: "YOU VOTED. 97% SAID DAILY." (glitch reveal,
      "97%" and "DAILY" in green).
    text:
      - { key: s04_text, role: headline, reveal: glitch, highlight: s04_highlight }
    image: assets/vote_daily_crop.png   # 1176×1655 crop of the X post (header → stats)
    bar_rect: [153, 1050, 937, 118]     # "daily 97%" bar in the crop, px [x, y, w, h]
    phone_rise: { start: 9.317, end: 9.75 }
    text_reveal: { start: 9.40, duration: 0.5 }
    push_in: { start: 9.75, end: 10.867 }
    highlight_at: 10.067                                  # beat
    camera: push-in toward the bar (scale 1 → 1.6, re-framed on the bar), tilt eases slightly
    transition_out:
      type: radial_burst_bloom            # strip T1 (reference/higgsfield/transitions/T1_radial_burst_bloom.jpg)
      push_start: 10.867                  # camera dives into the highlighted bar (≈ 2.5 strip frames)
      burst_at: 10.967                    # the bar bursts into radial zoom-blur shards (T1 frame 7)
      end: 11.067                         # S05 opens on the green halftone bloom (T1 frames 8–10)
    review_at: [9.4, 9.6, 9.85, 10.1, 10.4, 10.9, 10.967, 11.033]
    sfx:
      - { cue: phone_rise,  sound: hf_whoosh,    at: 9.45,   gain_db: -13 }
      - { cue: bar_pop,     sound: hf_pop,       at: 10.067, gain_db: -8 }
      - { cue: burst_bloom, sound: bloom_whoosh, at: 11.0,   gain_db: -4 }

  # ------------------------------------------------------------------------------------------------
  - id: S05
    name: speedometer
    scene: scenes/S05_speedometer.html
    start: 11.067
    end: 13.067
    background: off-white #F7F7F7, halftone dot disc behind the gauge, faint static green/blue corner wash
    visual: >
      A large arc gauge of 7 LARGE segments, each with an upright day label. Start: only MON lit (green,
      black label) and "×1" in the center; the rest grey. TUE → SUN light up one per eighth-note beat
      (flash as each lights), the center ticks ×2 … ×7 in sync. On SUN (×7): scale punch, ring, sparks.
      Caption under the number.
    text:
      - { key: s05_segments, role: segment_labels }
      - { key: s05_to, role: center_number }
      - { key: s05_caption, role: caption, reveal: glitch }
    transition_in:
      type: halftone_bloom                # strip T1 frames 8–10: green halftone bloom floods, then clears
      start: 11.067
      flood_at: 11.133                    # frame fully covered
      clear_end: 11.30                    # cleared to off-white, speedometer already there
    caption_reveal: { start: 11.25, duration: 0.4 }
    lights_at: [11.317, 11.567, 11.817, 12.067, 12.317, 12.567]   # TUE … SUN (eighths; SUN on the beat)
    burst_at: 12.567
    camera: slow push-in 1.00→1.04
    transition_out:
      type: recede_into_depth             # strip T2: gauge shrinks into depth with blur + color shift
      start: 12.817
      end: 13.067                         # background darkens off-white → graphite over the same window
    review_at: [11.1, 11.2, 11.33, 11.6, 12.1, 12.6, 12.9, 13.03]
    sfx:
      - { cue: tue, sound: hf_tick, at: 11.317, gain_db: -4 }
      - { cue: wed, sound: hf_tick, at: 11.567, gain_db: -4 }
      - { cue: thu, sound: hf_tick, at: 11.817, gain_db: -4 }
      - { cue: fri, sound: hf_tick, at: 12.067, gain_db: -4 }
      - { cue: sat, sound: hf_tick, at: 12.317, gain_db: -4 }
      - { cue: sun_impact, sound: hf_impact_small, at: 12.567, gain_db: -13 }
      - { cue: recede_swoosh, sound: deep_swoosh, at: 13.0, gain_db: -9 }

  # ------------------------------------------------------------------------------------------------
  - id: S06
    name: daily
    scene: scenes/S06_daily.html
    start: 13.067
    end: 15.067
    background: graphite #141414, faint halftone dot grid behind the chart area only
    visual: >
      After the Higgsfield "10x ENTERPRISE ADOPTION SINCE JUNE" shot: a huge green "DAILY" with the caption
      under it. Then a thin green line chart draws in ABOVE it, left to right, rising, through exactly 4 dots —
      one above each date label — and its appearance pushes the text block down. The last dot (OCT 1)
      flashes. X-axis labels only, no values, no Y-axis.
    text:
      - { key: s06_headline, role: headline }
      - { key: s06_caption, role: caption, reveal: glitch }
      - { key: s06_axis, role: axis_labels }
    transition_in:
      type: macro_pullback                # strip T4 second half: huge out-of-focus DAILY pulls back into focus
      start: 13.067
      end: 13.43
    caption_reveal: { start: 13.317, duration: 0.4 }      # after the rack focus (eighth)
    chart_draw: { start: 13.567, end: 14.567 }            # beat → beat
    last_dot_at: 14.567
    chart_points: [0.1, 0.3, 0.58, 1.0]                   # one dot per axis label (SEP 28 … OCT 1), relative heights
    camera: slow push-in 1.00→1.04
    transition_out:
      type: vertical_whip                 # strip T3 first half: content drifts up, then streaks upward
      drift_start: 14.8
      start: 14.967
      end: 15.067
    review_at: [13.1, 13.2, 13.35, 13.7, 14.1, 14.6, 14.9, 15.03]
    sfx:
      - { cue: chart_swoosh, sound: hf_whoosh, at: 13.62, gain_db: -15 }
      - { cue: vertical_whip, sound: hf_whoosh, at: 15.03, gain_db: -6 }

  # ------------------------------------------------------------------------------------------------
  - id: S07
    name: link
    scene: scenes/S07_link.html
    start: 15.067
    end: 16.567
    tail: 0.233             # renders under S08 while the pill shrinks to the center and dissolves
    background: off-white #F7F7F7 (slides up from the bottom), flooded to graphite #141414 from the click point
    visual: >
      Starts on off-white: pill with a thin black outline and black URL; a green gradient light runs around
      the outline. A cursor glides in, hovers, clicks — from the click point a circular reveal floods the frame
      to graphite; at the same moment the pill springs up with overshoot and its outline + text invert to white;
      the green light keeps running around it. Then into S08.
    text:
      - { key: s07_url, role: pill_text }
    transition_in:
      type: vertical_whip                 # strip T3 second half: the new off-white frame slides up from the bottom
      start: 15.067
      end: 15.35
    pill_in: { start: 15.15, end: 15.45 }
    gradient_run: { start: 15.30, end: 16.80, laps: 1.6 }
    cursor: { enter_at: 15.55, hover_at: 15.90, click_at: 16.067 }   # click on the beat
    flood: { start: 16.067, end: 16.40 }                             # circular reveal to graphite from the cursor
    spring: { start: 16.067 }
    camera: slow push-in
    review_at: [15.13, 15.25, 15.5, 15.95, 16.1, 16.2, 16.4, 16.55]
    sfx:
      - { cue: shimmer, sound: hf_shimmer,   at: 15.30,  gain_db: -14 }
      - { cue: click,   sound: hf_click,     at: 16.067, gain_db: -6 }
      - { cue: flood,   sound: reveal_swell, at: 16.10,  gain_db: -10 }

  # ------------------------------------------------------------------------------------------------
  - id: S08
    name: logo
    scene: scenes/S08_logo.html
    start: 16.567
    end: 18.133             # end of the track
    background: graphite #141414, flat; the logo's own bloom breathes
    visual: >
      The pill shrinks to the center and dissolves; the full TaleX logo (light version) slides in from a HUGE
      size into the center with motion blur and eases to a stop, then holds to the last frame.
    pill_out: { start: 16.567, end: 16.80 }
    logo_in: { start: 16.617, end: 17.25 }
    camera: logo breathes (glow), no other motion after landing except a very slow push-in
    review_at: [16.6, 16.75, 16.9, 17.1, 17.5, 18.1]
    sfx:
      - { cue: logo_whoosh, sound: hf_whoosh, at: 16.72, gain_db: -19 }
