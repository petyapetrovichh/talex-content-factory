<!doctype html>
<!--
  S07 — THE LINK (v2). Enters with T3's second half: the off-white frame slides up from the bottom (vertical
  blur), graphite visible above it. Pill with a thin black outline + black URL (glitch reveal, echo-outline
  entry); a green gradient light runs around the outline. A cursor glides in, hovers (pill brightens), clicks:
  from the click point a circular reveal floods the frame to graphite; at the same moment the pill springs up
  with overshoot and its outline + text invert to white; the green light keeps running. In the tail (under
  S08) the pill shrinks to the center and dissolves.
  Copy from brief.md, timing from shotlist.yaml (window.__TALEX__). Scene-local time.
-->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="S07_link-template">
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--tx-black);
          font-family: "Archivo", sans-serif;
        }
        #s07-frame {
          position: absolute;
          left: 0;
          top: 0;
          width: 1440px;
          height: 1080px;
          overflow: hidden;
          background: var(--tx-white);
          filter: url(#s07-vblur);
        }
        #s07-wash {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 50% 40% at 100% 100%, var(--tx-wash-green), rgba(111, 240, 0, 0) 70%),
            radial-gradient(ellipse 45% 38% at 0% 0%, var(--tx-wash-blue), rgba(120, 170, 255, 0) 70%);
        }
        #s07-flood {
          position: absolute;
          inset: 0;
          background: var(--tx-black);
          clip-path: circle(0px at 0px 0px);
        }
        #s07-cam {
          position: absolute;
          inset: 0;
        }
        #s07-pillpos {
          position: absolute;
          inset: 0;
          filter: url(#s07-blur);
        }
        #s07-pill {
          position: absolute;
        }
        .s07-echo {
          position: absolute;
          inset: 0;
          border-radius: 999px;
          border-style: solid;
          opacity: 0;
        }
        #s07-body {
          position: absolute;
          inset: 0;
          border-radius: 999px;
          border: 3px solid var(--tx-black);
          background: rgba(111, 240, 0, 0);
        }
        #s07-text {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 52px;
          line-height: 1;
          font-weight: 720;
          font-stretch: 104%;
          letter-spacing: 0.005em;
          color: var(--tx-black);
        }
        #s07-run {
          position: absolute;
          left: -12px;
          top: -12px;
          overflow: visible;
        }
        #s07-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 70px;
          height: 87px;
          overflow: visible;
          filter: url(#s07-cblur);
        }
        #s07-ripple {
          position: absolute;
          width: 120px;
          height: 120px;
          margin: -60px 0 0 -60px;
          border-radius: 50%;
          border: 4px solid var(--tx-green);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="S07_link" data-width="1440" data-height="1080">
        <svg width="0" height="0" style="position: absolute">
          <filter id="s07-vblur" x="0%" y="-20%" width="100%" height="140%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s07-vblur-fe" stdDeviation="0 0" />
          </filter>
          <filter id="s07-blur" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s07-blur-fe" stdDeviation="0 0" />
          </filter>
          <filter id="s07-cblur" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s07-cblur-fe" stdDeviation="0 0" />
          </filter>
          <filter id="s07-runglow" x="-10%" y="-40%" width="120%" height="180%">
            <feGaussianBlur stdDeviation="5" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </svg>
        <div id="s07-frame" data-layout-allow-overflow="true">
          <div id="s07-wash"></div>
          <div id="s07-flood"></div>
          <div id="s07-cam" data-layout-allow-overflow="true">
            <div id="s07-pillpos">
              <div id="s07-pill">
                <div class="s07-echo" id="s07-echo-0"></div>
                <div class="s07-echo" id="s07-echo-1"></div>
                <div class="s07-echo" id="s07-echo-2"></div>
                <div id="s07-body"></div>
                <svg id="s07-run"></svg>
                <div id="s07-text" data-layout-allow-overlap="true"></div>
              </div>
            </div>
            <div id="s07-ripple"></div>
            <svg id="s07-cursor" viewBox="0 0 58 72">
              <path d="M4 3 L4 58 L17 46 L27 68 L37 63 L27 42 L45 42 Z" fill="#FFFFFF" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const D = window.__TALEX__;
          const FX = window.TalexFX;
          const S = D.shots.S07;
          const T = D.tokens;
          const C = T.colors;
          const copy = D.copy;
          const L = (t) => t - S.start;
          const $ = (id) => document.getElementById(id);
          const NS = "http://www.w3.org/2000/svg";
          const svgEl = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            if (parent) parent.appendChild(e);
            return e;
          };
          const clamp01 = (x) => Math.max(0, Math.min(1, x));
          const tl = gsap.timeline({ paused: true });
          const END = L(S.end + (S.tail || 0));

          // ---------- geometry ----------
          const pw = 1010, ph = 126;
          const left = (1440 - pw) / 2, top = 540 - ph / 2;
          const pill = $("s07-pill");
          Object.assign(pill.style, { left: `${left}px`, top: `${top}px`, width: `${pw}px`, height: `${ph}px` });

          // ---------- T3 (second half): the off-white frame slides up from the bottom ----------
          const TI = S.transition_in;
          const s0 = L(TI.start), s1 = L(TI.end);
          FX.blurMove(tl, $("s07-frame"), $("s07-vblur-fe"), {
            start: 0, end: s1 + 0.05, max: 50, k: 110,
            fn: (t) => ({ x: 0, y: FX.tween(t, s0, s1, 1080, 0, "expo.out") }),
          });

          // ---------- green gradient light running around the outline (3 stacked dashes = comet) ----------
          const run = $("s07-run");
          run.setAttribute("width", pw + 24);
          run.setAttribute("height", ph + 24);
          run.setAttribute("viewBox", `-12 -12 ${pw + 24} ${ph + 24}`);
          const g = svgEl("g", { filter: "url(#s07-runglow)" }, run);
          const rr = { x: 1.5, y: 1.5, width: pw - 3, height: ph - 3, rx: (ph - 3) / 2, fill: "none", pathLength: 1000, "stroke-linecap": "round" };
          const comet = [
            { len: 380, w: 14, col: C.green, op: 0.3 },
            { len: 220, w: 9, col: C.green, op: 0.85 },
            { len: 70, w: 6, col: C.green_hot, op: 1 },
          ].map((c) => ({ ...c, el: svgEl("rect", { ...rr, stroke: c.col, "stroke-width": c.w, opacity: 0, "stroke-dasharray": `${c.len} ${1000 - c.len}` }, g) }));
          const GR = S.gradient_run;
          const r0 = L(GR.start), r1 = L(GR.end), laps = GR.laps || 1;
          FX.driver(tl, 0, END, (t) => {
            const p = (t - r0) / (r1 - r0);
            const live = p > 0 && p < 1;
            const head = laps * 1000 * clamp01(p); // steady speed; keeps running through the flood and the tail
            comet.forEach((c) => {
              c.el.setAttribute("stroke-dashoffset", (-head + c.len).toFixed(1));
              c.el.setAttribute("opacity", live ? String(c.op * Math.min(1, Math.min(p, 1 - p) * 10)) : "0");
            });
          });

          // ---------- entry: echo outlines collapse, URL glitch reveal (black on off-white) ----------
          const echoes = [0, 1, 2].map((i) => $(`s07-echo-${i}`));
          const i0 = L(S.pill_in.start), i1 = L(S.pill_in.end);
          echoes.forEach((e, i) => {
            e.style.borderColor = T.pill.echo.colors[i];
            e.style.borderWidth = `${T.pill.echo.stroke_px[i]}px`;
            const off = T.pill.echo.offset_px[i];
            tl.fromTo(e, { x: off, y: off * 0.15, opacity: 0.9 - i * 0.18 }, { x: 0, y: 0, opacity: 0, duration: i1 - i0, ease: T.pill.echo.ease, immediateRender: false }, i0 + 0.04);
          });
          tl.fromTo("#s07-pill", { scaleX: 0.6, scaleY: 0.85, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, i0);
          FX.glitchReveal(tl, $("s07-text"), copy.s07_url, {
            start: i0 + 0.05, duration: 0.42, seed: 71,
            color: C.black, flash: T.glitch_reveal.resolve_flash_on_white, charset: T.glitch_reveal.charset.toLowerCase() + "./",
            gap: T.glitch_reveal.gap_probability, step: T.glitch_reveal.step_s,
          });

          // ---------- cursor: glide in (motion blur), hover, click ----------
          const cu = S.cursor;
          const e0 = L(cu.enter_at), hv = L(cu.hover_at), ck = L(cu.click_at);
          const target = { x: left + pw * 0.66, y: top + ph * 0.62 };
          const cursorPos = (t) => ({
            x: FX.tween(t, e0, hv, 1480, target.x, "power3.out"),
            y: FX.tween(t, e0, hv, 1020, target.y, "power3.out"),
          });
          const cur = $("s07-cursor");
          FX.blurMove(tl, cur, $("s07-cblur-fe"), { start: 0, end: END, max: 18, k: 140, fn: cursorPos });
          tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, e0);
          // hover: the pill brightens (green tint inside the black outline)
          tl.fromTo("#s07-body", { backgroundColor: "rgba(111,240,0,0)", boxShadow: "0 0 0 rgba(111,240,0,0)" },
            { backgroundColor: "rgba(111,240,0,0.16)", boxShadow: "0 0 34px rgba(111,240,0,0.45)", duration: 0.16, ease: "power2.out", immediateRender: false }, hv - 0.06);
          // click
          tl.fromTo(cur, { scale: 1 }, { scale: 0.8, duration: 0.06, ease: "power2.in", transformOrigin: "4px 3px", immediateRender: false }, ck - 0.06);
          tl.to(cur, { scale: 1, duration: 0.12, ease: "power2.out", transformOrigin: "4px 3px" }, ck);
          const click = { x: target.x + 4, y: target.y + 3 };
          const rp = $("s07-ripple");
          Object.assign(rp.style, { left: `${click.x}px`, top: `${click.y}px` });
          tl.fromTo(rp, { scale: 0.2, opacity: 1 }, { scale: 2.2, opacity: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, ck);

          // ---------- circular reveal from the click point: the frame floods to graphite ----------
          const f0 = L(S.flood.start), f1 = L(S.flood.end);
          const fl = $("s07-flood");
          const maxR = Math.hypot(Math.max(click.x, 1440 - click.x), Math.max(click.y, 1080 - click.y)) + 20;
          FX.driver(tl, 0, END, (t) => {
            const r = maxR * gsap.parseEase("power2.out")(clamp01((t - f0) / (f1 - f0)));
            fl.style.clipPath = `circle(${r.toFixed(1)}px at ${click.x.toFixed(0)}px ${click.y.toFixed(0)}px)`;
          });
          // at the same moment: outline + text invert to white, pill springs up with overshoot
          tl.to("#s07-body", { borderColor: C.white, backgroundColor: "rgba(111,240,0,0.08)", boxShadow: "0 0 30px rgba(111,240,0,0.35)", duration: 0.12, ease: "power2.out" }, ck);
          // the glitch reveal colors every letter on its own → invert the letters themselves
          const letters = [...$("s07-text").querySelectorAll(":scope > span > span:first-child")];
          const inv = gsap.utils.interpolate(C.black, C.white);
          FX.driver(tl, ck - 0.001, 0.12, (t, p) => letters.forEach((el) => (el.style.color = p <= 0 ? C.black : inv(p))));
          tl.to(cur, { opacity: 0, duration: 0.25, ease: "power1.in" }, ck + 0.2);
          const sp = L(S.spring.start);
          tl.fromTo("#s07-pill", { scale: 1 }, { scale: 1.12, duration: 0.7, ease: "elastic.out(1.1, 0.35)", immediateRender: false }, sp);

          // ---------- tail (under S08): shrink to the center + dissolve ----------
          const x0 = L(S.end);
          tl.to("#s07-pill", { scale: 0.12, opacity: 0, duration: 0.23, ease: "power3.in" }, x0);
          FX.driver(tl, x0 - 0.001, 0.23, (t, p) => $("s07-blur-fe").setAttribute("stdDeviation", `${(p <= 0 ? 0 : 14 * p).toFixed(1)} ${(p <= 0 ? 0 : 14 * p).toFixed(1)}`));

          // ---------- camera: slow push ----------
          tl.fromTo("#s07-cam", { scale: 1 }, { scale: 1.03, duration: END, ease: "sine.inOut" }, 0);

          window.__timelines["S07_link"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
