<!doctype html>
<!--
  S06 — DAILY. (Higgsfield "10x ENTERPRISE ADOPTION SINCE JUNE" move.) Enters with T4: a huge out-of-focus
  bloom-green "DAILY" pulls back to size while racking into focus; then a thin green line chart draws in ABOVE
  it, left → right, rising through exactly one dot per date label — its appearance pushes the text block down.
  The last dot (OCT 1) flashes. X-axis labels only (no values, no Y-axis). Exits with T3 (vertical whip).
  Copy from brief.md, timing from shotlist.yaml (window.__TALEX__). Scene-local time.
-->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="S06_daily-template">
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--tx-black);
          font-family: "Archivo", sans-serif;
        }
        #s06-bg,
        #s06-cam,
        #s06-sparks {
          position: absolute;
          inset: 0;
        }
        /* faint halftone dot grid behind the chart area only */
        #s06-dots {
          position: absolute;
          left: 150px;
          top: 90px;
          width: 1140px;
          height: 560px;
          background-image: radial-gradient(circle, var(--tx-halftone-dark) 3px, rgba(0, 0, 0, 0) 3.6px);
          background-size: 26px 26px;
          -webkit-mask-image: radial-gradient(ellipse 60% 60% at 70% 40%, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0) 100%);
          mask-image: radial-gradient(ellipse 60% 60% at 70% 40%, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0) 100%);
          opacity: 0;
        }
        #s06-chart {
          position: absolute;
          left: 0;
          top: 0;
          width: 1440px;
          height: 1080px;
          overflow: visible;
        }
        .s06-axis {
          font-family: "Archivo", sans-serif;
          font-size: 24px;
          font-weight: 700;
          font-stretch: 106%;
          letter-spacing: 0.06em;
        }
        #s06-blockpos {
          position: absolute;
          left: 0;
          width: 100%;
        }
        #s06-block {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #s06-headstack {
          display: grid;
        }
        .s06-head {
          grid-area: 1 / 1;
          font-size: 270px;
          line-height: 0.92;
          font-weight: var(--tx-display-weight);
          font-stretch: var(--tx-display-stretch);
          letter-spacing: -0.02em;
          color: var(--tx-green);
          white-space: nowrap;
          text-align: center;
        }
        #s06-head {
          text-shadow: var(--tx-bloom);
        }
        #s06-head-bloom {
          filter: blur(26px);
          opacity: 0.55;
        }
        #s06-caption {
          margin-top: 26px;
          font-size: 46px;
          line-height: 1;
          font-weight: var(--tx-caption-weight);
          font-stretch: var(--tx-caption-stretch);
          letter-spacing: 0.03em;
          text-transform: uppercase;
          color: var(--tx-white);
        }
      </style>

      <div id="root" data-composition-id="S06_daily" data-width="1440" data-height="1080">
        <svg width="0" height="0" style="position: absolute">
          <filter id="s06-vblur" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s06-vblur-fe" stdDeviation="0 0" />
          </filter>
        </svg>
        <div id="s06-bg" data-layout-allow-overflow="true">
        </div>
        <div id="s06-cam" data-layout-allow-overflow="true">
          <div id="s06-dots"></div>
          <svg id="s06-chart" viewBox="0 0 1440 1080"></svg>
          <div id="s06-sparks"></div>
          <div id="s06-blockpos">
            <div id="s06-block">
              <div id="s06-headstack">
                <div class="s06-head" id="s06-head-bloom" data-layout-allow-overlap="true"></div>
                <div class="s06-head" id="s06-head" data-layout-allow-overlap="true"></div>
              </div>
              <div id="s06-caption" data-layout-allow-overlap="true"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const D = window.__TALEX__;
          const FX = window.TalexFX;
          const S = D.shots.S06;
          const T = D.tokens;
          const C = T.colors;
          const copy = D.copy;
          const L = (t) => t - S.start;
          const $ = (id) => document.getElementById(id);
          const NS = "http://www.w3.org/2000/svg";
          const svgEl = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            if (parent) parent.appendChild(e);
            return e;
          };
          const tl = gsap.timeline({ paused: true });
          const END = L(S.end);

          $("s06-head").textContent = copy.s06_headline;
          $("s06-head-bloom").textContent = copy.s06_headline;

          // ---------- layout: block centered first, pushed down when the chart arrives ----------
          const blockH = 270 * 0.92 + 26 + 46; // headline + gap + caption
          const topCentered = 540 - blockH / 2 + 10;
          const topPushed = 650;
          const bp = $("s06-blockpos");
          bp.style.top = `${topCentered}px`;

          // ---------- chart (illustrative): points, line, dots, axis ----------
          const x0 = 210, x1 = 1230, yBase = 560, yTop = 150;
          // exactly one dot per axis label, each vertically aligned to its label (same x as the label)
          const nL = copy.s06_axis.length;
          if (S.chart_points.length !== nL) throw new Error(`S06: chart_points (${S.chart_points.length}) must match s06_axis (${nL})`);
          const labelX = (i) => x0 + ((x1 - x0) * i) / (nL - 1);
          const pts = S.chart_points.map((h, i) => [labelX(i), yBase - h * (yBase - yTop)]);
          const svg = $("s06-chart");
          const defs = svgEl("defs", {}, svg);
          const glow = svgEl("filter", { id: "s06-glow", x: "-20%", y: "-50%", width: "140%", height: "200%" }, defs);
          svgEl("feGaussianBlur", { in: "SourceGraphic", stdDeviation: 6, result: "b" }, glow);
          const mg = svgEl("feMerge", {}, glow);
          svgEl("feMergeNode", { in: "b" }, mg);
          svgEl("feMergeNode", { in: "SourceGraphic" }, mg);
          const chart = svgEl("g", { id: "s06-chartg" }, svg);
          const axis = svgEl("line", { x1: x0 - 20, y1: yBase + 26, x2: x1 + 20, y2: yBase + 26, stroke: "rgba(255,255,255,0.18)", "stroke-width": 2 }, chart);
          const labels = copy.s06_axis.map((txt, i, a) => {
            const t = svgEl("text", { x: labelX(i), y: yBase + 66, "text-anchor": "middle", class: "s06-axis", fill: "rgba(255,255,255,0.55)" }, chart);
            t.textContent = txt;
            return t;
          });
          const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
          const line = svgEl("path", { d, fill: "none", stroke: C.green, "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round", filter: "url(#s06-glow)" }, chart);
          const segLen = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
          const total = segLen.reduce((a, b) => a + b, 0);
          const cum = [0];
          segLen.forEach((l) => cum.push(cum[cum.length - 1] + l));
          line.setAttribute("stroke-dasharray", `${total} ${total}`);
          line.setAttribute("stroke-dashoffset", `${total}`);
          const dots = pts.map((p) =>
            svgEl("circle", { cx: p[0], cy: p[1], r: 10, fill: C.black, stroke: C.green, "stroke-width": 5, filter: "url(#s06-glow)", opacity: 0 }, chart),
          );
          const tip = svgEl("circle", { cx: pts[0][0], cy: pts[0][1], r: 7, fill: C.green_hot, filter: "url(#s06-glow)", opacity: 0 }, chart);

          const c0 = L(S.chart_draw.start), c1 = L(S.chart_draw.end);
          const eDraw = gsap.parseEase("power1.inOut");
          FX.driver(tl, 0, END, (t) => {
            const p = Math.max(0, Math.min(1, (t - c0) / (c1 - c0)));
            const drawn = total * eDraw(p);
            line.setAttribute("stroke-dashoffset", (total - drawn).toFixed(1));
            // tip rides the pen
            let k = 0;
            while (k < segLen.length - 1 && drawn > cum[k + 1]) k++;
            const f = segLen[k] ? Math.min(1, (drawn - cum[k]) / segLen[k]) : 0;
            const tx = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f, ty = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f;
            tip.setAttribute("cx", tx.toFixed(1));
            tip.setAttribute("cy", ty.toFixed(1));
            tip.setAttribute("opacity", p > 0 && p < 1 ? "1" : "0");
            dots.forEach((dot, i) => {
              const hit = p > 0 && drawn >= cum[i] - 0.5;
              dot.setAttribute("opacity", hit ? "1" : "0");
            });
          });
          // dots pop as the pen reaches them
          dots.forEach((dot, i) => {
            const pAt = cum[i] / total; // invert the ease numerically to find when the pen reaches the dot
            let lo = 0, hi = 1;
            for (let it = 0; it < 30; it++) {
              const mid = (lo + hi) / 2;
              if (eDraw(mid) < pAt) lo = mid;
              else hi = mid;
            }
            const at = c0 + (c1 - c0) * hi;
            tl.fromTo(dot, { attr: { r: 0 } }, { attr: { r: 10 }, duration: 0.25, ease: "back.out(3)", immediateRender: false }, at);
          });
          // chart layer arrives from above as it draws; axis labels fade in with the pen
          tl.fromTo("#s06-chartg", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, c0 - 0.05);
          tl.fromTo("#s06-dots", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, c0 - 0.1);
          labels.forEach((lab, i) => tl.fromTo(lab, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, c0 + ((c1 - c0) * i) / (labels.length - 1) * 0.9));

          // the chart's appearance pushes the text block down
          tl.fromTo("#s06-block", { y: 0 }, { y: topPushed - topCentered, duration: 0.45, ease: "power3.inOut" }, c0 - 0.2);
          tl.fromTo("#s06-block", { scale: 1 }, { scale: 0.86, duration: 0.45, ease: "power3.inOut" }, c0 - 0.2);

          // last dot flashes
          const f0 = L(S.last_dot_at);
          const last = pts[pts.length - 1];
          tl.fromTo(dots[dots.length - 1], { attr: { fill: C.white } }, { attr: { fill: C.black }, duration: 0.5, ease: "power2.out", immediateRender: false }, f0);
          const ring = svgEl("circle", { cx: last[0], cy: last[1], r: 12, fill: "none", stroke: C.green, "stroke-width": 4, opacity: 0 }, chart);
          tl.fromTo(ring, { attr: { r: 12 }, opacity: 1 }, { attr: { r: 90 }, opacity: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, f0);
          FX.sparks(tl, $("s06-sparks"), { at: f0, count: 12, cx: last[0], cy: last[1], r0: 14, r1: 120, len: 22, thick: 3, dur: 0.4, color: C.green_hot, seed: 61 });

          // ---------- T4 "macro pull-back" (reference/higgsfield/transitions/T4, second half):
          //            a huge out-of-focus DAILY fills the frame and pulls back to size while racking into focus ----------
          const TI = S.transition_in;
          const m0 = L(TI.start), m1 = L(TI.end);
          bp.style.transformOrigin = `720px ${(270 * 0.92) / 2}px`;
          tl.fromTo(bp, { scale: 5.2, filter: "blur(34px)" }, { scale: 1, filter: "blur(0px)", duration: m1 - m0, ease: "expo.out", immediateRender: true }, m0);
          tl.fromTo("#s06-head", { color: C.green_hot }, { color: C.green, duration: 0.4, ease: "power2.out", immediateRender: false }, m1 - 0.15);
          FX.glitchReveal(tl, $("s06-caption"), copy.s06_caption, {
            start: L(S.caption_reveal.start), duration: S.caption_reveal.duration, seed: 65,
            color: C.white, flash: T.glitch_reveal.resolve_flash_on_black, charset: T.glitch_reveal.charset,
            gap: T.glitch_reveal.gap_probability, step: T.glitch_reveal.step_s,
          });

          // ---------- camera: slow push; the headline's own bloom breathes ----------
          tl.fromTo("#s06-cam", { scale: 1 }, { scale: 1.04, duration: END, ease: "sine.inOut" }, 0);
          tl.fromTo("#s06-head-bloom", { opacity: 0.4 }, { opacity: 0.7, duration: END / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

          // ---------- T3 "vertical whip" (first half): content drifts up, then streaks upward ----------
          const TO = S.transition_out;
          const v0 = L(TO.drift_start), w0 = L(TO.start), w1 = L(TO.end);
          tl.to("#s06-cam", { y: -40, duration: w0 - v0, ease: "power1.in" }, v0);
          tl.to("#s06-cam", { y: -1250, duration: w1 - w0, ease: "power3.in" }, w0);
          $("s06-cam").style.filter = "url(#s06-vblur)";
          FX.driver(tl, w0 - 0.001, w1 - w0, (t, p) => $("s06-vblur-fe").setAttribute("stdDeviation", `0 ${(p <= 0 ? 0 : 8 + 60 * p).toFixed(1)}`));

          window.__timelines["S06_daily"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
