<!doctype html>
<!--
  S05 — SPEEDOMETER. Opens on T1's green halftone bloom clearing to off-white. A large arc gauge of 7 LARGE
  segments (upright day labels). Start: MON lit, "×1". TUE → SUN light up one per eighth beat (each flashes),
  the center ticks ×2 … ×7 in sync; on SUN a burst (scale punch, ring, sparks). Caption under the number.
  Exit = T2: the gauge recedes into depth with blur + color shift while the background darkens to graphite.
  Copy from brief.md, timing from shotlist.yaml (window.__TALEX__). Scene-local time.
-->
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="S05_speedometer-template">
      <style>
        @font-face {
          font-family: "Archivo";
          src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
          font-weight: 100 900;
          font-stretch: 62% 125%;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Archivo", sans-serif;
        }
        #s05-panel {
          position: absolute;
          left: 0;
          top: 0;
          width: 1440px;
          height: 1080px;
          background: var(--tx-white);
          overflow: hidden;
        }
        /* halftone dot disc as a graphic element behind the gauge (never full-frame) */
        #s05-dots {
          position: absolute;
          left: 170px;
          top: 50px;
          width: 1100px;
          height: 1100px;
          border-radius: 50%;
          background-image: radial-gradient(circle, var(--tx-halftone-light) 3.2px, rgba(0, 0, 0, 0) 3.8px);
          background-size: 26px 26px;
          -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0) 72%);
          mask-image: radial-gradient(circle, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0) 72%);
        }
        /* static, very faint corner washes */
        #s05-wash {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 50% 42% at 100% 100%, var(--tx-wash-green), rgba(111, 240, 0, 0) 70%),
            radial-gradient(ellipse 45% 38% at 0% 0%, var(--tx-wash-blue), rgba(120, 170, 255, 0) 70%);
        }
        /* T1 frames 8–10: green halftone bloom that floods the frame, then clears */
        #s05-bloom {
          position: absolute;
          left: -330px;
          top: -450px;
          width: 2100px;
          height: 2100px;
          border-radius: 50%;
          background: radial-gradient(closest-side, #6ff000 0%, #6ff000 48%, rgba(111, 240, 0, 0.75) 60%, rgba(111, 240, 0, 0) 72%);
          opacity: 0;
        }
        #s05-bloomdots {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background-image: radial-gradient(circle, rgba(40, 110, 0, 0.55) 3.4px, rgba(0, 0, 0, 0) 4px);
          background-size: 16px 16px;
          -webkit-mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.3) 60%, rgba(0, 0, 0, 0) 72%);
          mask-image: radial-gradient(closest-side, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.3) 60%, rgba(0, 0, 0, 0) 72%);
        }
        #s05-cam,
        #s05-sparks {
          position: absolute;
          inset: 0;
        }
        #s05-gauge {
          position: absolute;
          left: 0;
          top: 0;
          width: 1440px;
          height: 1080px;
          overflow: visible;
        }
        .s05-label {
          font-family: "Archivo", sans-serif;
          font-size: 34px;
          font-weight: 800;
          font-stretch: 108%;
          letter-spacing: 0.03em;
        }
        #s05-center {
          position: absolute;
          left: 0;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #s05-numstack {
          display: grid;
        }
        .s05-num {
          grid-area: 1 / 1;
          font-size: 210px;
          line-height: 1;
          font-weight: var(--tx-display-weight);
          font-stretch: var(--tx-display-stretch);
          letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums;
          color: var(--tx-black);
          white-space: nowrap;
          text-align: center;
        }
        .s05-numcopy {
          opacity: 0;
        }
        #s05-caption {
          margin-top: 10px;
          font-size: 33px;
          line-height: 1;
          font-weight: var(--tx-caption-weight);
          font-stretch: var(--tx-caption-stretch);
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: var(--tx-black);
        }
        #s05-ring {
          position: absolute;
          border-radius: 50%;
          border: 6px solid var(--tx-green);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="S05_speedometer" data-width="1440" data-height="1080">
        <svg width="0" height="0" style="position: absolute">
          <filter id="s05-dblur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="s05-dblur-fe" stdDeviation="0 0" />
          </filter>
        </svg>
        <div id="s05-panel" data-layout-allow-overflow="true">
          <div id="s05-wash"></div>
          <div id="s05-dots"></div>
          <div id="s05-cam" data-layout-allow-overflow="true">
            <div id="s05-ring"></div>
            <div id="s05-sparks"></div>
            <svg id="s05-gauge" viewBox="0 0 1440 1080"></svg>
            <div id="s05-center">
              <div id="s05-numstack">
                <div class="s05-num s05-numcopy" id="s05-num-v" data-layout-allow-overlap="true"></div>
                <div class="s05-num s05-numcopy" id="s05-num-g" data-layout-allow-overlap="true"></div>
                <div class="s05-num" id="s05-num" data-layout-allow-overlap="true"></div>
              </div>
              <div id="s05-caption" data-layout-allow-overlap="true"></div>
            </div>
          </div>
        </div>
        <div id="s05-bloom"><div id="s05-bloomdots"></div></div>
      </div>

      <script>
        (function () {
          const D = window.__TALEX__;
          const FX = window.TalexFX;
          const S = D.shots.S05;
          const T = D.tokens;
          const C = T.colors;
          const copy = D.copy;
          const L = (t) => t - S.start;
          const $ = (id) => document.getElementById(id);
          const NS = "http://www.w3.org/2000/svg";
          const svgEl = (tag, attrs, parent) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            if (parent) parent.appendChild(e);
            return e;
          };
          const tl = gsap.timeline({ paused: true });
          const END = L(S.end);
          const GREY = "#E4E7E1", GREY_TXT = "#9A9E97";

          // ---------- gauge geometry: 240° arc open at the bottom, 7 large segments ----------
          const cx = 720, cy = 600, rO = 440, rI = 300, sweep = 240, gapDeg = 4;
          const days = copy.s05_segments;
          const n = days.length;
          const segDeg = (sweep - gapDeg * (n - 1)) / n;
          const pt = (r, deg) => {
            const a = (deg * Math.PI) / 180; // 0° = 12 o'clock, clockwise
            return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
          };
          const sector = (a0, a1) => {
            const [x0, y0] = pt(rO, a0), [x1, y1] = pt(rO, a1), [x2, y2] = pt(rI, a1), [x3, y3] = pt(rI, a0);
            return `M${x0} ${y0} A${rO} ${rO} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${rI} ${rI} 0 0 0 ${x3} ${y3} Z`;
          };
          const g = $("s05-gauge");
          const defs = svgEl("defs", {}, g);
          const glowF = svgEl("filter", { id: "s05-glow", x: "-30%", y: "-30%", width: "160%", height: "160%" }, defs);
          svgEl("feGaussianBlur", { in: "SourceGraphic", stdDeviation: 10, result: "b" }, glowF);
          const m = svgEl("feMerge", {}, glowF);
          svgEl("feMergeNode", { in: "b" }, m);
          svgEl("feMergeNode", { in: "SourceGraphic" }, m);
          const segs = days.map((day, i) => {
            const a0 = -sweep / 2 + i * (segDeg + gapDeg), a1 = a0 + segDeg;
            const grp = svgEl("g", {}, g);
            const body = svgEl("path", { d: sector(a0, a1), fill: GREY, stroke: GREY, "stroke-width": 10, "stroke-linejoin": "round" }, grp);
            const flash = svgEl("path", { d: sector(a0, a1), fill: C.white, stroke: C.white, "stroke-width": 10, "stroke-linejoin": "round", opacity: 0 }, grp);
            const [lx, ly] = pt((rO + rI) / 2, (a0 + a1) / 2);
            const label = svgEl("text", { x: lx, y: ly + 12, "text-anchor": "middle", class: "s05-label", fill: GREY_TXT }, grp);
            label.textContent = day; // upright, never rotated
            return { grp, body, flash, label, mid: [lx, ly] };
          });
          const light = (s, on) => {
            s.body.setAttribute("fill", on ? C.green : GREY);
            s.body.setAttribute("stroke", on ? C.green : GREY);
            s.body.setAttribute("filter", on ? "url(#s05-glow)" : "");
            s.label.setAttribute("fill", on ? C.black : GREY_TXT);
          };

          // ---------- center number + caption ----------
          const center = $("s05-center");
          center.style.top = `${cy - 185}px`;
          const numText = (v) => `${copy.s05_prefix}${v}`;
          const nums = ["s05-num", "s05-num-v", "s05-num-g"].map($);
          $("s05-num-v").style.color = C.violet;
          $("s05-num-g").style.color = C.green;
          const lightsAt = S.lights_at.map(L);
          // state as a pure function of t: how many segments are lit
          const litCount = (t) => 1 + lightsAt.filter((a) => t >= a).length;
          let last = -1;
          const render = (t) => {
            const c = Math.min(n, litCount(t));
            if (c === last) return;
            last = c;
            segs.forEach((s, i) => light(s, i < c));
            nums.forEach((el) => (el.textContent = numText(copy.s05_from + c - 1)));
          };
          render(0);
          FX.driver(tl, 0, END, render);

          // each light: segment flash + pop, number punch
          lightsAt.forEach((a, i) => {
            const s = segs[i + 1];
            tl.fromTo(s.flash, { opacity: 0.95 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, a);
            tl.fromTo(s.grp, { scale: 1.06, svgOrigin: `${cx} ${cy}` }, { scale: 1, svgOrigin: `${cx} ${cy}`, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, a);
            tl.fromTo("#s05-numstack", { scale: 1.12 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, a);
          });

          // ---------- SUN (×7): burst ----------
          const b = L(S.burst_at);
          tl.fromTo("#s05-numstack", { scale: 1.3 }, { scale: 1, duration: 0.55, ease: T.easing.settle, immediateRender: false }, b + 0.001);
          tl.fromTo("#s05-gauge", { scale: 1.035, transformOrigin: `${cx}px ${cy}px` }, { scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, b);
          FX.rgbSplit(tl, [$("s05-num-v"), $("s05-num-g")], { at: b, frames: 2, px: 12, fps: D.video.fps, seed: 51 });
          const ring = $("s05-ring");
          Object.assign(ring.style, { left: `${cx - 150}px`, top: `${cy - 150}px`, width: "300px", height: "300px" });
          FX.ring(tl, ring, { at: b, from: 0.5, to: 3.4, dur: 0.6 });
          FX.sparks(tl, $("s05-sparks"), { at: b, count: 30, cx, cy: cy - 40, r0: 140, r1: 560, len: 44, thick: 4, dur: 0.5, color: C.green, glow: false, seed: 53 });

          // ---------- caption ----------
          FX.glitchReveal(tl, $("s05-caption"), copy.s05_caption, {
            start: L(S.caption_reveal.start), duration: S.caption_reveal.duration, seed: 55,
            color: C.black, flash: T.glitch_reveal.resolve_flash_on_white, charset: T.glitch_reveal.charset,
            gap: T.glitch_reveal.gap_probability, step: T.glitch_reveal.step_s,
          });

          // ---------- T1 (second half): green halftone bloom floods the frame, clears to off-white ----------
          const TI = S.transition_in;
          const bi0 = L(TI.start), bf = L(TI.flood_at), bc = L(TI.clear_end);
          tl.fromTo("#s05-bloom", { scale: 0.3, opacity: 1 }, { scale: 1, opacity: 1, duration: bf - bi0, ease: "power2.out", immediateRender: true }, bi0);
          tl.to("#s05-bloom", { scale: 1.5, opacity: 0, duration: bc - bf, ease: "power2.in" }, bf);
          // the speedometer is already there under the flood (hidden until the frame is covered, like T1 frame 9)
          tl.fromTo("#s05-cam", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none", immediateRender: true }, bf);
          tl.to(["#s05-dots", "#s05-wash"], { opacity: 1, duration: 0.001 }, bf);
          tl.fromTo("#s05-gauge", { scale: 0.92 }, { scale: 1, duration: bc - bi0 + 0.15, ease: "power3.out", transformOrigin: `${cx}px ${cy}px` }, bi0);

          // ---------- T2 "recede into depth": on the ×7 burst the gauge shrinks away with blur + color shift,
          //            while the background darkens to graphite (reference/higgsfield/transitions/T2) ----------
          const r0 = L(S.transition_out.start), r1 = L(S.transition_out.end);
          tl.fromTo("#s05-cam", { scale: 1 }, { scale: 1.04, duration: r0, ease: "sine.inOut" }, 0); // camera: slow push
          tl.to("#s05-cam", { scale: 0.32, duration: r1 - r0, ease: "power2.in" }, r0);
          $("s05-cam").style.filter = "url(#s05-dblur)";
          FX.driver(tl, r0 - 0.001, r1 - r0, (t, p) => {
            const b = p <= 0 ? 0 : 10 * Math.pow(p, 1.3);
            $("s05-dblur-fe").setAttribute("stdDeviation", `${b.toFixed(1)} ${b.toFixed(1)}`);
          });
          // color shift toward warm/dim as it recedes (lime → yellow, like the strip)
          tl.fromTo("#s05-gauge", { filter: "hue-rotate(0deg) brightness(1) saturate(1)" }, { filter: "hue-rotate(-38deg) brightness(0.8) saturate(0.85)", duration: r1 - r0, ease: "power1.in", immediateRender: false }, r0);
          tl.to("#s05-panel", { backgroundColor: C.black, duration: r1 - r0, ease: "power2.in" }, r0);
          tl.to(["#s05-dots", "#s05-wash"], { opacity: 0, duration: (r1 - r0) * 0.7, ease: "power1.in" }, r0);
          tl.to("#s05-center", { color: C.white, duration: r1 - r0, ease: "power2.in" }, r0);
          tl.to(["#s05-num", "#s05-caption"], { color: "#9a9a9a", duration: r1 - r0, ease: "power2.in" }, r0);

          window.__timelines["S05_speedometer"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
